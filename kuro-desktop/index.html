<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Kuro Desktop - Little Abraham (IA Locale)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1e293b; padding: 12px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.1rem; color: #38bdf8; }
    #app { display: flex; flex: 1; overflow: hidden; }
    .auth-card { background: #1e293b; padding: 24px; border-radius: 8px; margin: 24px; border: 1px solid #334155; }
    .input-group { display: flex; gap: 12px; margin-top: 12px; }
    input[type="url"], textarea { flex: 1; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; }
    button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #0369a1; }
    .status-badge { margin-top: 12px; font-size: 0.85rem; }
    .workspace-layout { display: flex; width: 100%; height: 100%; }
    .sidebar-rag { width: 300px; background: #1e293b; border-right: 1px solid #334155; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .dropzone { border: 2px dashed #38bdf8; border-radius: 8px; padding: 24px 12px; text-align: center; cursor: pointer; color: #94a3b8; font-size: 0.85rem; }
    .files-list { list-style: none; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .files-list li { background: #0f172a; padding: 8px; border-radius: 4px; border: 1px solid #334155; }
    .chat-container { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
    .chat-header { padding: 16px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .security-badge { background: #15803d; color: #dcfce7; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; }
    .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; }
    .message.user { align-self: flex-end; background: #0284c7; color: white; }
    .message.assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .message.system { align-self: center; background: #334155; font-size: 0.8rem; color: #cbd5e1; }
    .input-area { padding: 16px; background: #1e293b; display: flex; gap: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Kuro Desktop — Little Abraham (Client IA Local)</h1>
  </header>

  <div id="app">
    <div id="auth-container" style="width: 100%;"></div>
    <div id="workspace-container" style="width: 100%; display: none;"></div>
  </div>

  <script src="src/components/AuthNextcloud.js"></script>
  <script src="src/services/localInference.js"></script>
  <script src="src/components/ChatWorkspace.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const auth = new AuthNextcloud();
      auth.renderForm('auth-container');

      const inference = new LocalInference();
      const workspace = new ChatWorkspace(inference);
      
      // Bascule automatique vers le workspace si connecté
      if (auth.isConnected()) {
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('workspace-container').style.display = 'block';
        workspace.render('workspace-container');
      }
    });
  </script>
</body>
</html>
