networks:
  kuro-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  drive_data:
  chat_data:
  mail_data:
  sign_data:
  crm_data:
  data_data:
  apps_data:
  watch_data:
  affiliate_data:

services:
  # ==========================================
  # REVERSE PROXY & SSL AUTOMATIQUE
  # ==========================================
  caddy:
    image: caddy:2-alpine
    container_name: kuro-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  # ==========================================
  # SERVICES PACK CORE
  # ==========================================
  kuro-office:
    image: onlyoffice/documentserver:latest
    container_name: kuro-office
    restart: always
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  kuro-notes:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: kuro-notes
    restart: always
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  kuro-drive:
    image: nextcloud:latest
    container_name: kuro-drive
    restart: always
    environment:
      - OBJECTSTORE_S3_BUCKET=${B2_BUCKET_NAME}
      - OBJECTSTORE_S3_REGION=${B2_REGION}
      - OBJECTSTORE_S3_KEY=${B2_KEY_ID}
      - OBJECTSTORE_S3_SECRET=${B2_APPLICATION_KEY}
      - OBJECTSTORE_S3_HOST=${B2_ENDPOINT}
      - OBJECTSTORE_S3_PORT=443
      - OBJECTSTORE_S3_SSL=true
      - OBJECTSTORE_S3_AUTOCREATE=true
    volumes:
      - drive_data:/var/www/html
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  kuro-chat:
    image: mattermost/mattermost-team-edition:latest
    container_name: kuro-chat
    restart: always
    volumes:
      - chat_data:/mattermost/data
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  kuro-meet:
    image: jitsi/web:latest
    container_name: kuro-meet
    restart: always
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  kuro-mail:
    image: axllent/mailpit:latest
    container_name: kuro-mail
    restart: always
    volumes:
      - mail_data:/data
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  kuro-pdf:
    image: frooodle/s-pdf:latest
    container_name: kuro-pdf
    restart: always
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  kuro-diagram:
    image: jgraph/drawio:latest
    container_name: kuro-diagram
    restart: always
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  kuro-send:
    image: lscr.io/linuxserver/pairdrop:latest
    container_name: kuro-send
    restart: always
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  kuro-affiliate:
    image: node:20-alpine
    container_name: kuro-affiliate
    restart: always
    command: ["node", "-e", "const http = require('http'); http.createServer((req, res) => { res.writeHead(200, {'Content-Type': 'application/json'}); res.end(JSON.stringify({ status: 'ok', service: 'Kuro Affiliate' })); }).listen(3000);"]
    environment:
      - PORT=3000
      - AFFILIATE_RECURRING_COMMISSION_PERCENTAGE=15
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    volumes:
      - affiliate_data:/app/data
    networks:
      - kuro-network
    profiles: ["core", "pro"]

  # ==========================================
  # SERVICES PACK PRO
  # ==========================================
  kuro-sign:
    image: docuseal/docuseal:latest
    container_name: kuro-sign
    restart: always
    volumes:
      - sign_data:/data
    networks:
      - kuro-network
    profiles: ["pro"]

  kuro-crm:
    image: twentycrm/twenty:latest
    container_name: kuro-crm
    restart: always
    volumes:
      - crm_data:/app/data
    networks:
      - kuro-network
    profiles: ["pro"]

  kuro-data:
    image: baserow/baserow:latest
    container_name: kuro-data
    restart: always
    volumes:
      - data_data:/media/mstorage
    networks:
      - kuro-network
    profiles: ["pro"]

  kuro-apps:
    image: budibase/budibase:latest
    container_name: kuro-apps
    restart: always
    volumes:
      - apps_data:/data
    networks:
      - kuro-network
    profiles: ["pro"]

  kurowatch:
    image: dgtlmoon/changedetection.io:latest
    container_name: kurowatch
    restart: always
    volumes:
      - watch_data:/datastore
    networks:
      - kuro-network
    profiles: ["pro"]

  kuro-studio:
    image: linuxserver/shotcut:latest
    container_name: kuro-studio
    restart: always
    networks:
      - kuro-network
    profiles: ["pro"]

  abraham-ai:
    image: ghcr.io/open-webui/open-webui:main
    container_name: abraham-ai
    restart: always
    networks:
      - kuro-network
    profiles: ["pro"]
